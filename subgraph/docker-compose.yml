version: '3'
services:
  graph-node:
    image: graphprotocol/graph-node:latest
    ports:
      - '8000:8000'
      - '8001:8001'
      - '8020:8020'
      - '8030:8030'
      - '8040:8040'
    depends_on:
      - ipfs
      - postgres
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: 'ipfs:5001'
      ethereum: 'mainnet:${ETHEREUM_RPC_URL:-https://eth-mainnet.g.alchemy.com/v2/demo}'
      GRAPH_LOG: info
    extra_hosts:
      - host.docker.internal:host-gateway

  ipfs:
    image: ipfs/kubo:v0.17.0
    ports:
      - '5001:5001'

  postgres:
    image: postgres:14
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
